<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>OB-Star KDE Volume</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02050a;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 5;
      max-width: 420px;
      padding: 10px 12px;
      border: 1px solid rgba(180, 210, 255, 0.20);
      border-radius: 7px;
      background: rgba(3, 7, 15, 0.72);
      backdrop-filter: blur(5px);
      pointer-events: none;
    }

    #title {
      margin-bottom: 5px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    #status,
    #hint {
      color: rgba(230, 240, 255, 0.75);
      font-size: 12px;
      line-height: 1.45;
    }

    #hint {
      margin-top: 5px;
      color: rgba(190, 210, 235, 0.55);
    }

    .hint-heading {
      margin-bottom: 2px;

      color: rgba(230, 240, 255, 0.85);

      font-size: 12px;
      font-weight: 700;
    }

    #error {
      position: fixed;
      inset: 20px;
      z-index: 100;
      max-width: 700px;
      height: fit-content;
      margin: auto;
      padding: 18px;
      border: 1px solid #b84b4b;
      border-radius: 8px;
      background: rgba(45, 5, 8, 0.95);
      color: white;
      white-space: pre-wrap;
      font-family: monospace;
    }

    .lil-gui.root {
      --background-color: rgba(8, 14, 25, 0.92);
      --widget-color: #1b3851;
      --hover-color: #294f71;
      --focus-color: #3977a7;
      --text-color: #e8f4ff;
      --number-color: #9ed8ff;
    }

    /*
      Hide the otherwise empty lil-gui root title bar.

      The three scientific layers become the visible top-level menu entries.
    */
    .lil-gui.root > .title {
      display: none;
    }

    /* ------------------------------------------------------------------------- */
    /* EXTERNAL TRAJECTORY TIME SLIDER                                           */
    /* ------------------------------------------------------------------------- */

    #time-control {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 50;

      width: min(760px, 52vw, calc(100vw - 48px));

      transform: translateX(-50%);

      pointer-events: auto;
      user-select: none;
    }

    /*
      The floating current-time label.

      It is deliberately unboxed and placed higher above the slider,
      avoiding overlap with the circular thumb.
    */
    #time-readout {
      position: absolute;
      bottom: 44px;
      left: 50%;
      z-index: 4;

      transform: translateX(-50%);

      padding: 0;
      border: none;
      background: transparent;

      color: white;

      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;

      text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.95),
        0 0 8px rgba(0, 0, 0, 0.80);

      pointer-events: none;
    }

    /*
      Tick marks lie behind the slider thumb but remain visible around it.
    */
    #time-ticks {
      position: absolute;
      top: 9px;

      /*
        The slider thumb is 18 px wide.

        The browser moves the thumb centre from 9 px inside the left edge
        to 9 px inside the right edge. Therefore tick marks must use this
        same available travel range rather than the full input width.
      */
      left: 9px;
      width: calc(100% - 18px);

      z-index: 1;
      height: 16px;

      pointer-events: none;
    }

    /*
      Standard tick: every 10 Myr.
    */
    .time-tick {
      position: absolute;
      bottom: 0;

      width: 1px;
      height: 7px;

      transform: translateX(-50%);

      background: rgba(255, 255, 255, 0.72);
    }

    /*
      The present-day t = 0 Myr tick is more prominent.
    */
    .time-tick.now {
      width: 2px;
      height: 15px;

      background: rgba(255, 255, 255, 1.0);

      box-shadow: 0 0 5px rgba(255, 255, 255, 0.60);
    }

    #time-slider {
      position: relative;
      z-index: 2;

      display: block;

      width: 100%;
      height: 26px;
      margin: 0;

      appearance: none;
      -webkit-appearance: none;

      background: transparent;
      cursor: pointer;
    }

    /* Chrome, Edge, Safari */
    #time-slider::-webkit-slider-runnable-track {
      height: 3px;

      border-radius: 99px;

      background: rgba(255, 255, 255, 0.92);

      box-shadow:
        0 0 4px rgba(255, 255, 255, 0.55),
        0 0 10px rgba(180, 225, 255, 0.28);
    }

    /* Chrome, Edge, Safari */
    #time-slider::-webkit-slider-thumb {
      width: 18px;
      height: 18px;

      margin-top: -7.5px;

      border: 2px solid rgba(10, 18, 30, 0.95);
      border-radius: 50%;

      background: #ffffff;

      appearance: none;
      -webkit-appearance: none;

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 2px 8px rgba(0, 0, 0, 0.55);
    }

    /*
      Glow the time thumb only while the pointer/mouse button is held down.
    */
    #time-slider:active::-webkit-slider-thumb {
      background: #ffffff;

      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.75),
        0 0 8px rgba(255, 255, 255, 0.90),
        0 0 18px rgba(130, 215, 255, 0.80),
        0 0 30px rgba(100, 180, 255, 0.45);
    }

    /* Firefox */
    #time-slider::-moz-range-track {
      height: 3px;

      border-radius: 99px;

      background: rgba(255, 255, 255, 0.92);

      box-shadow:
        0 0 4px rgba(255, 255, 255, 0.55),
        0 0 10px rgba(180, 225, 255, 0.28);
    }

    /* Firefox */
    #time-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;

      border: 2px solid rgba(10, 18, 30, 0.95);
      border-radius: 50%;

      background: #ffffff;

      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 2px 8px rgba(0, 0, 0, 0.55);
    }

    #time-slider:active::-moz-range-thumb {
      background: #ffffff;

      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.75),
        0 0 8px rgba(255, 255, 255, 0.90),
        0 0 18px rgba(130, 215, 255, 0.80),
        0 0 30px rgba(100, 180, 255, 0.45);
    }

    #time-endpoints {
      position: relative;

      display: flex;
      justify-content: space-between;

      margin-top: 7px;

      color: rgba(225, 235, 250, 0.80);

      font-size: 11px;
      line-height: 1;
    }

    /*
      Keep "Now" exactly centered regardless of the relative widths
      of "Past" and "Future".
    */
    #time-now {
      position: absolute;
      left: 50%;

      transform: translateX(-50%);

      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
    }

    @media (max-width: 650px) {
      #time-control {
        bottom: 18px;
        width: calc(100vw - 36px);
      }

      #time-readout {
        bottom: 42px;
        font-size: 12px;
      }
    }

  </style>
</head>

<body>
  <div id="app"></div>

  <div id="hud">
    <div id="title">
      &quot;Requiem for a belt&quot; interactive visualization tool
    </div>

    <div id="status" aria-live="polite"></div>

    <div id="hint">
      <div class="hint-heading">Instructions:</div>

      Left drag: orbit · Wheel: zoom · Right drag: pan
    </div>
  </div>

  <div id="time-control" hidden>
    <div id="time-readout">t = 0 Myr</div>

    <!-- Tick marks are generated dynamically by app.js. -->
    <div id="time-ticks" aria-hidden="true"></div>

    <input
      id="time-slider"
      type="range"
      min="-61"
      max="61"
      step="1"
      value="0"
      aria-label="Cluster trajectory time in Myr"
    />

    <div id="time-endpoints">
      <span id="time-minimum">Past</span>
      <span id="time-now">Now</span>
      <span id="time-maximum">Future</span>
    </div>
  </div>

  <div id="error" hidden></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
